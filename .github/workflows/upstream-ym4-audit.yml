name: Upstream 4D Lean transfer audit

on:
  pull_request:
    paths:
      - "docs/upstream-4d-lean-audit/**"
      - "tools/audit_upstream_ym4.py"
      - "tests/test_upstream_ym4_audit.py"
      - "program.yaml"
      - ".github/workflows/upstream-ym4-audit.yml"
  push:
    branches: [main]
    paths:
      - "docs/upstream-4d-lean-audit/**"
      - "tools/audit_upstream_ym4.py"
      - "tests/test_upstream_ym4_audit.py"
      - "program.yaml"
      - ".github/workflows/upstream-ym4-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pin-and-negative-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML parser
        run: python -m pip install "pyyaml>=6.0"
      - name: Research-only source crosswalk audit
        run: python tools/audit_upstream_ym4.py
      - name: Adversarial crosswalk regression tests
        run: python -m unittest discover -s tests -p 'test_upstream_ym4_audit.py' -v
      - name: Python syntax validation
        run: python -m compileall -q tools/audit_upstream_ym4.py tests/test_upstream_ym4_audit.py
