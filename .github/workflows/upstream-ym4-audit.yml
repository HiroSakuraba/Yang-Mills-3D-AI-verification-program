name: Upstream 4D Lean transfer audit

on:
  pull_request:
    paths:
      - "docs/upstream-4d-lean-audit/**"
      - "tools/audit_upstream_ym4.py"
      - "tools/build_finite_gas_transfer.py"
      - "tools/check_finite_gas_transfer.py"
      - "tests/test_upstream_ym4_audit.py"
      - "tests/test_finite_gas_transfer.py"
      - "tools/check_mass_gap_obligations.py"
      - "tests/test_mass_gap_obligations.py"
      - "program.yaml"
      - ".github/workflows/upstream-ym4-audit.yml"
  push:
    branches: [main]
    paths:
      - "docs/upstream-4d-lean-audit/**"
      - "tools/audit_upstream_ym4.py"
      - "tools/build_finite_gas_transfer.py"
      - "tools/check_finite_gas_transfer.py"
      - "tests/test_upstream_ym4_audit.py"
      - "tests/test_finite_gas_transfer.py"
      - "tools/check_mass_gap_obligations.py"
      - "tests/test_mass_gap_obligations.py"
      - "program.yaml"
      - ".github/workflows/upstream-ym4-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pin-and-finite-gas-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML parser
        run: python -m pip install "pyyaml>=6.0"
      - name: Research-only source crosswalk audit
        run: python tools/audit_upstream_ym4.py
      - name: Adversarial crosswalk regression tests
        run: python -m unittest discover -s tests -p 'test_upstream_ym4_audit.py' -v
      - name: Regenerate exact finite 3D support seed
        run: |
          python tools/build_finite_gas_transfer.py --output /tmp/finite_gas_seed.json
          diff -u docs/upstream-4d-lean-audit/finite_gas_seed.json /tmp/finite_gas_seed.json
      - name: Independent exact-rational finite gas audit
        run: python tools/check_finite_gas_transfer.py docs/upstream-4d-lean-audit/finite_gas_seed.json
      - name: Finite gas regression and negative controls
        run: python -m unittest discover -s tests -p 'test_finite_gas_transfer.py' -v
      - name: Continuum gap boundary ledger (research-only)
        run: python tools/check_mass_gap_obligations.py docs/upstream-4d-lean-audit/mass_gap_obligations.json
      - name: Continuum gap claim and arithmetic negative controls
        run: python -m unittest discover -s tests -p 'test_mass_gap_obligations.py' -v
      - name: Python syntax validation
        run: >
          python -m compileall -q tools/audit_upstream_ym4.py
          tools/build_finite_gas_transfer.py
          tools/check_finite_gas_transfer.py
          tests/test_upstream_ym4_audit.py
          tests/test_finite_gas_transfer.py
          tools/check_mass_gap_obligations.py
          tests/test_mass_gap_obligations.py
